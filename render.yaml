services:
  - type: web
    name: zeitfuchs-api
    runtime: node
    plan: free
    region: frankfurt
    branch: api
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: globuu-db
          property: connectionString
      - key: ALLOW_ORIGINS
        value: https://zeitfuchs.ch,https://www.zeitfuchs.ch,https://zeitfuchs-wkdm.onrender.com
      - key: ZF_AUTH_HASH
        sync: false
