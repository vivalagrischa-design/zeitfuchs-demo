    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c)));
    try{sessionStorage.setItem("zf_pw",pw)}catch(e){}
  }catch(x){ m.textContent=(x&&x.name==="OperationError")?"Passwort falsch.":"Fehler im Browser: "+(x&&x.message||x); return; }
  try{ document.open(); document.write(html); document.close(); }
  catch(x){ m.textContent="Seite konnte nicht geöffnet werden: "+(x&&x.message||x); }
});
}
</script>
</body>
