const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const m=document.getElementById("m");
if(!window.crypto||!crypto.subtle){m.textContent="Dieser Browser kann die Seite hier nicht entschlüsseln. Bitte über https://zeitfuchs.ch/werkstatt/ öffnen.";}
async function unlock(pw,auto){
  m.textContent=auto?"Öffne Werkstatt …":"Prüfe …";
  let html;
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c)));
    try{sessionStorage.setItem("zf_pw",pw)}catch(e){}
    try{if(auto||document.getElementById("keep").checked)localStorage.setItem("zf_pw_keep",pw);else localStorage.removeItem("zf_pw_keep")}catch(e){}
  }catch(x){
    if(auto){try{localStorage.removeItem("zf_pw_keep");sessionStorage.removeItem("zf_pw")}catch(e){}m.textContent="";return;}
    m.textContent=(x&&x.name==="OperationError")?"Passwort falsch.":"Fehler im Browser: "+(x&&x.message||x); return; }
  try{ document.open(); document.write(html); document.close(); }
  catch(x){ m.textContent="Seite konnte nicht geöffnet werden: "+(x&&x.message||x); }
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();unlock(document.getElementById("p").value.trim(),false)});
if(window.crypto&&crypto.subtle){let saved=null;try{saved=localStorage.getItem("zf_pw_keep")||sessionStorage.getItem("zf_pw")}catch(e){}if(saved)unlock(saved,true);}
}
